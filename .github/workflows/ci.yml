name: CI

# Every quality gate from PRD section 14. A pull request cannot merge unless all of them
# pass, and the emoji check fails the build if a single emoji reaches source, templates,
# seed data or interface strings.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: No emojis anywhere
        run: python scripts/check_no_emoji.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pramaansetu
          POSTGRES_PASSWORD: pramaansetu
          POSTGRES_DB: pramaansetu_test
        options: >-
          --health-cmd "pg_isready -U pramaansetu"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Type check
        working-directory: backend
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Unit, property, statistical, concurrency and authorisation tests
        working-directory: backend
        run: pytest -q --tb=short

      - name: Coverage on the domain modules
        working-directory: backend
        run: |
          pip install pytest-cov
          pytest -q --cov=app/domain --cov=app/services \
                    --cov-report=term-missing --cov-fail-under=70

      - name: Seed determinism
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          python -m app.seed --reset --quiet
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.core.db import session_scope
          from app.models.evidence import EvidenceReport
          from app.services import audit

          async def main():
              async with session_scope() as session:
                  report = (await session.execute(select(EvidenceReport))).scalars().first()
                  assert report is not None, "the seed produced no Evidence Report"
                  assert report.confidence_score and report.confidence_score > 80, report.confidence_score
                  verification = await audit.verify(session)
                  assert verification.verified, verification.detail
                  print("seed verified, score", report.confidence_score)
          asyncio.run(main())
          PY

      - name: OpenAPI document generates
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from app.main import app
          document = app.openapi()
          assert document["openapi"].startswith("3.1")
          paths = len(document["paths"])
          assert paths > 40, paths
          json.dump(document, open("openapi.json", "w"), indent=2)
          print("openapi paths:", paths)
          PY

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: backend/openapi.json
          if-no-files-found: ignore

  frontend:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed and start the API
        working-directory: backend
        run: |
          python -m app.seed --reset --quiet
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/healthz

      - name: Build and start the web application
        working-directory: frontend
        env:
          API_ORIGIN: http://127.0.0.1:8000
        run: |
          npm ci || npm install
          npm run build
          nohup npm run start &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done

      - name: Walk the core pages
        run: python scripts/smoke_test.py

  container-images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t pramaansetu-api:ci ./backend
      - name: Build the web image
        run: docker build -t pramaansetu-web:ci ./frontend
      - name: Scan the images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pramaansetu-api:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
